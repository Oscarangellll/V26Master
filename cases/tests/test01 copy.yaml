# vessel_types: optional, default is all vessel types
# max_multiday_vessels: required
# bases: required, list of bases 
# periods: optional, default is all months
# days_per_period: optional, default 30
# wind_farms: required, list of wind farms
# maintenance_categories: optional, list of categories

vessel_types: ["CTV", "SOV"]

max_multiday_vessels: 2

bases: ["1"]

periods: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]

days_per_period: 30

wind_farms: ["A"]
